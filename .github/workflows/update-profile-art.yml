name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *" # every day, ~06:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_heatmap_svg.py
      # Publish to a single-commit orphan branch so main's history stays clean.
      - name: Publish to output branch
        run: |
          mkdir -p /tmp/out/data
          cp contrib-heatmap.svg /tmp/out/
          cp data/contributions.json /tmp/out/data/
          cd /tmp/out
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "chore: refresh contribution graph"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
